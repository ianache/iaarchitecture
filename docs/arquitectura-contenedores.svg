<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 980" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555555"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1280" height="980" fill="#ffffff"/>
  <text x="640" y="34" text-anchor="middle" font-size="24" font-weight="700" fill="#111111">Architecture AI — Diagrama de contenedores (C4, nivel 2)</text>

  <!-- Persons -->
  <g>
    <rect x="330" y="60" width="240" height="90" rx="8" fill="#08427b"/>
    <text x="450" y="95" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Arquitecto de solución</text>
    <text x="450" y="118" text-anchor="middle" font-size="12" fill="#d6e4f0">[Persona]</text>
    <text x="450" y="136" text-anchor="middle" font-size="11" fill="#d6e4f0">Envía requisitos, compara alternativas</text>
  </g>
  <g>
    <rect x="700" y="60" width="240" height="90" rx="8" fill="#08427b"/>
    <text x="820" y="95" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Revisor / Aprobador</text>
    <text x="820" y="118" text-anchor="middle" font-size="12" fill="#d6e4f0">[Persona]</text>
    <text x="820" y="136" text-anchor="middle" font-size="11" fill="#d6e4f0">Revisa y aprueba decisiones</text>
  </g>

  <!-- System boundary -->
  <rect x="140" y="200" width="1000" height="360" rx="10" fill="none" stroke="#8a8a8a" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="160" y="225" font-size="14" font-weight="700" fill="#555555">Architecture AI [Sistema de software]</text>

  <!-- Web UI -->
  <rect x="180" y="245" width="260" height="110" rx="8" fill="#1168bd"/>
  <text x="310" y="278" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Web UI</text>
  <text x="310" y="298" text-anchor="middle" font-size="11" fill="#d6e4f0">[Contenedor: React + Vite]</text>
  <text x="310" y="317" text-anchor="middle" font-size="10" fill="#d6e4f0">Análisis, revisión, trazabilidad,</text>
  <text x="310" y="331" text-anchor="middle" font-size="10" fill="#d6e4f0">knowledge change requests</text>

  <!-- CLI -->
  <rect x="480" y="245" width="260" height="110" rx="8" fill="#1168bd"/>
  <text x="610" y="278" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">CLI</text>
  <text x="610" y="298" text-anchor="middle" font-size="11" fill="#d6e4f0">[Contenedor: Node.js + Commander]</text>
  <text x="610" y="317" text-anchor="middle" font-size="10" fill="#d6e4f0">Automatización por terminal:</text>
  <text x="610" y="331" text-anchor="middle" font-size="10" fill="#d6e4f0">analyze, package, review, publish</text>

  <!-- API -->
  <rect x="180" y="400" width="560" height="120" rx="8" fill="#1168bd"/>
  <text x="460" y="435" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">API</text>
  <text x="460" y="456" text-anchor="middle" font-size="11" fill="#d6e4f0">[Contenedor: Node.js + Fastify]</text>
  <text x="460" y="476" text-anchor="middle" font-size="10" fill="#d6e4f0">Orquesta el análisis (ArchitectureOrchestrator),</text>
  <text x="460" y="492" text-anchor="middle" font-size="10" fill="#d6e4f0">expone REST, aplica gobernanza y trazabilidad</text>

  <!-- SQLite -->
  <rect x="800" y="400" width="300" height="120" rx="8" fill="#1168bd"/>
  <text x="950" y="435" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Base de datos operativa</text>
  <text x="950" y="456" text-anchor="middle" font-size="11" fill="#d6e4f0">[Contenedor: SQLite]</text>
  <text x="950" y="476" text-anchor="middle" font-size="10" fill="#d6e4f0">Análisis, decisiones, revisiones,</text>
  <text x="950" y="492" text-anchor="middle" font-size="10" fill="#d6e4f0">auditoría, knowledge change requests</text>

  <!-- External systems -->
  <rect x="140" y="640" width="280" height="120" rx="8" fill="#8a8a8a"/>
  <text x="280" y="675" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Repositorio de Knowledge</text>
  <text x="280" y="696" text-anchor="middle" font-size="11" fill="#eeeeee">[Externo: Git]</text>
  <text x="280" y="716" text-anchor="middle" font-size="10" fill="#eeeeee">knowledge/ + ontology/</text>

  <rect x="480" y="640" width="280" height="120" rx="8" fill="#8a8a8a"/>
  <text x="620" y="675" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Ollama (on-prem)</text>
  <text x="620" y="696" text-anchor="middle" font-size="11" fill="#eeeeee">[Externo]</text>
  <text x="620" y="716" text-anchor="middle" font-size="10" fill="#eeeeee">Generación y embeddings locales</text>

  <rect x="820" y="640" width="280" height="120" rx="8" fill="#8a8a8a"/>
  <text x="960" y="675" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Modelos públicos</text>
  <text x="960" y="696" text-anchor="middle" font-size="11" fill="#eeeeee">[Externo: OpenAI / Gemini / Claude]</text>
  <text x="960" y="716" text-anchor="middle" font-size="10" fill="#eeeeee">Fallback si la política lo permite</text>

  <!-- Arrows: persons to containers -->
  <path d="M420,150 L340,245" fill="none" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="330" y="195" font-size="10" fill="#333333">Usa (HTTPS)</text>

  <path d="M480,150 L610,245" fill="none" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="500" y="195" font-size="10" fill="#333333">Usa (terminal)</text>

  <path d="M790,150 L400,245" fill="none" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="640" y="185" font-size="10" fill="#333333">Usa (HTTPS)</text>

  <!-- Arrows: containers to API -->
  <path d="M310,355 L310,400" fill="none" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="318" y="380" font-size="10" fill="#333333">REST/JSON</text>

  <path d="M610,355 L610,400" fill="none" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="618" y="380" font-size="10" fill="#333333">REST/JSON</text>

  <!-- API to SQLite -->
  <path d="M740,460 L800,460" fill="none" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="745" y="450" font-size="10" fill="#333333">SQL</text>

  <!-- API to external systems -->
  <path d="M300,520 L280,640" fill="none" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="200" y="590" font-size="10" fill="#333333">Git / filesystem</text>

  <path d="M460,520 L580,640" fill="none" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="470" y="590" font-size="10" fill="#333333">HTTP</text>

  <path d="M620,520 L900,640" fill="none" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="740" y="590" font-size="10" fill="#333333">HTTPS (fallback)</text>

  <!-- Legend -->
  <g transform="translate(140,890)">
    <rect x="0" y="0" width="18" height="18" fill="#08427b"/>
    <text x="26" y="14" font-size="11" fill="#333333">Persona</text>
    <rect x="110" y="0" width="18" height="18" fill="#1168bd"/>
    <text x="136" y="14" font-size="11" fill="#333333">Contenedor (Architecture AI)</text>
    <rect x="360" y="0" width="18" height="18" fill="#8a8a8a"/>
    <text x="386" y="14" font-size="11" fill="#333333">Sistema externo</text>
  </g>
</svg>
